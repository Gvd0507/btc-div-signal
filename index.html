<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BTC-Alt Divergence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --bg:    #0e1010;
  --bg2:   #151919;
  --bg3:   #1a2020;
  --bg4:   #1f2727;
  --bdr:   #2a3535;
  --bdr2:  #334444;
  --text:  #d4e0e0;
  --text2: #7a9898;
  --text3: #4a6868;
  --green: #00c896;
  --gdim:  #00c89622;
  --red:   #ff4d4d;
  --rdim:  #ff4d4d18;
  --blue:  #4fa3d4;
  --bdim:  #4fa3d420;
  --amber: #f0a044;
  --adim:  #f0a04420;
  --white: #eef4f4;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── HEADER ─────────────────────────────────────────────────── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--bdr);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  gap: 8px;
}
.logo { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--green); letter-spacing: 0.06em; white-space: nowrap; }
.header-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); min-width: 0; }
.header-status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.last-upd { font-size: 10px; color: var(--text3); font-family: var(--mono); display: none; }
.scan-btn {
  background: none; border: 1px solid var(--bdr2); color: var(--text2);
  padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
  font-family: var(--sans); transition: all 0.15s; white-space: nowrap;
  -webkit-appearance: none;
}
.scan-btn:hover, .scan-btn:active { border-color: var(--green); color: var(--green); }

/* ── LAYOUT ─────────────────────────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 1fr 360px;
  min-height: calc(100vh - 45px);
  min-height: calc(100dvh - 45px);
}
.left-panel { padding: 16px; overflow-y: auto; border-right: 1px solid var(--bdr); }
.right-panel { padding: 16px; overflow-y: auto; background: var(--bg2); }

/* mobile tab bar */
.mobile-tabs { display: none; }

/* ── BTC BAR ─────────────────────────────────────────────────── */
.btc-bar {
  background: var(--bg3); border: 1px solid var(--bdr);
  border-radius: 6px; padding: 10px 14px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 16px;
}
.btc-item { display: flex; flex-direction: column; gap: 3px; }
.btc-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.btc-val { font-size: 13px; font-weight: 500; font-family: var(--mono); }

.regime-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
}
.regime-ranging { background: var(--gdim); color: var(--green); border: 1px solid #00c89640; }
.regime-trending { background: var(--adim); color: var(--amber); border: 1px solid #f0a04440; }

/* ── SECTION LABEL ───────────────────────────────────────────── */
.sec-label {
  font-size: 9px; font-weight: 500; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px;
}

/* ── SIGNAL CARDS ────────────────────────────────────────────── */
.signal-card {
  background: var(--bg3);
  border: 1px solid var(--bdr);
  border-left: 3px solid var(--blue);
  border-radius: 0 6px 6px 0;
  padding: 12px 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
.signal-card:active { background: var(--bg4); }
.signal-card.tier-a { border-left-color: var(--green); }
.signal-card.tier-b { border-left-color: var(--blue); }
.signal-card.tier-c { border-left-color: var(--text3); }

.sig-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.sig-meta { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
.sig-title { font-size: 15px; font-weight: 500; color: var(--white); }

.tier-badge {
  flex-shrink: 0; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 500; font-family: var(--mono);
}
.tier-a-badge { background: var(--gdim); color: var(--green); border: 1px solid #00c89650; }
.tier-b-badge { background: var(--bdim); color: var(--blue); border: 1px solid #4fa3d450; }
.tier-c-badge { background: #ffffff08; color: var(--text2); border: 1px solid var(--bdr); }

.sig-prices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.price-item { display: flex; flex-direction: column; gap: 2px; }
.price-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.price-val { font-size: 12px; font-family: var(--mono); font-weight: 500; }
.ev { color: var(--blue); }
.sv { color: var(--red); }
.tv { color: var(--green); }

.sig-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-size: 9px; padding: 2px 6px; border-radius: 3px;
  border: 1px solid var(--bdr); color: var(--text2);
  font-family: var(--mono);
}
.tag-ok { border-color: #00c89640; color: var(--green); background: var(--gdim); }
.tag-warn { border-color: #f0a04440; color: var(--amber); background: var(--adim); }

.sig-btn {
  width: 100%; margin-top: 10px; background: none;
  border: 1px solid var(--bdr2); color: var(--text2);
  padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
  font-family: var(--sans); transition: all 0.15s; -webkit-appearance: none;
}
.sig-btn:hover, .sig-btn:active { border-color: var(--green); color: var(--green); background: var(--gdim); }
.sig-btn.selected { border-color: var(--green); color: var(--green); background: var(--gdim); }

.no-signals {
  text-align: center; padding: 40px 16px; color: var(--text3);
  border: 1px dashed var(--bdr); border-radius: 6px; font-size: 13px; line-height: 1.7;
}
.no-signals a { color: var(--blue); }

/* ── SIZER PANEL ─────────────────────────────────────────────── */
.sig-header {
  background: var(--bg3); border: 1px solid var(--bdr);
  border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0;
  padding: 10px 12px; margin-bottom: 14px;
}
.sig-header.tier-a { border-left-color: var(--green); }

.tab-row { display: flex; border-bottom: 1px solid var(--bdr); margin-bottom: 14px; }
.tab {
  font-size: 12px; padding: 7px 12px; cursor: pointer;
  color: var(--text2); border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all 0.15s;
}
.tab.active { color: var(--text); border-bottom-color: var(--green); }
.panel { display: none; }
.panel.active { display: block; }

.inp-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.risk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.risk-box { background: var(--bg); border: 1px solid var(--bdr); border-radius: 4px; padding: 10px 10px; }
.inp-wrap { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--bdr); border-radius: 4px; margin-top: 5px; }
.inp-wrap:focus-within { border-color: var(--bdr2); }
.inp-pfx { padding: 0 8px; color: var(--text3); font-size: 13px; border-right: 1px solid var(--bdr); height: 34px; display: flex; align-items: center; flex-shrink: 0; }
.inp-wrap input { background: none; border: none; outline: none; color: var(--white); font-family: var(--mono); font-size: 14px; padding: 0 8px; height: 34px; width: 100%; min-width: 0; }

.slider-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
input[type=range] { -webkit-appearance: none; flex: 1; height: 3px; background: var(--bdr2); border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--green); border-radius: 50%; cursor: pointer; }
.risk-val { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--white); min-width: 34px; text-align: right; }

.pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.pill {
  font-size: 10px; padding: 3px 8px; border-radius: 3px;
  border: 1px solid var(--bdr); color: var(--text2); cursor: pointer;
  font-family: var(--mono); background: none; -webkit-appearance: none;
}
.pill.active { background: var(--gdim); border-color: #00c89650; color: var(--green); }
.pill.disabled { opacity: 0.3; pointer-events: none; }

.result-card { background: var(--bg); border: 1px solid var(--bdr); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
.lev-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.lev-num { font-size: 30px; font-weight: 500; font-family: var(--mono); color: var(--white); }
.lev-safe { background: var(--gdim); color: var(--green); border: 1px solid #00c89640; font-size: 10px; padding: 2px 7px; border-radius: 3px; }
.lev-unsafe { background: var(--rdim); color: var(--red); border: 1px solid #ff4d4d40; font-size: 10px; padding: 2px 7px; border-radius: 3px; }
.lev-note { font-size: 10px; color: var(--text3); font-family: var(--mono); }

.bar-wrap { margin: 8px 0 3px; }
.bar-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text3); margin-bottom: 4px; font-family: var(--mono); }
.bar-track { height: 4px; background: var(--bdr); border-radius: 2px; position: relative; }
.bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.2s; }
.bar-marker { position: absolute; top: -4px; width: 2px; height: 12px; background: var(--red); border-radius: 1px; }
.bar-hint { font-size: 9px; color: var(--text3); margin-top: 3px; }

.warn-box { background: var(--rdim); border: 1px solid #ff4d4d30; border-radius: 4px; padding: 7px 10px; font-size: 11px; color: var(--red); margin-top: 6px; display: none; line-height: 1.5; }

.metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.metric-box { background: var(--bg); border: 1px solid var(--bdr); border-radius: 4px; padding: 8px 10px; }
.metric-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
.metric-val { font-size: 14px; font-weight: 500; font-family: var(--mono); }
.metric-sub { font-size: 9px; color: var(--text3); margin-top: 2px; }

.outcome-card { background: var(--bg); border: 1px solid var(--bdr); border-radius: 4px; padding: 10px 12px; }
.out-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.out-row:not(:last-child) { border-bottom: 1px solid var(--bdr); }
.out-lbl { color: var(--text2); }
.out-g { color: var(--green); font-family: var(--mono); font-weight: 500; }
.out-r { color: var(--red); font-family: var(--mono); font-weight: 500; }
.out-n { color: var(--text); font-family: var(--mono); font-weight: 500; }

/* ── SCENARIO TABLE ──────────────────────────────────────────── */
.sc-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sc-tbl { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--mono); }
.sc-tbl th { text-align: right; padding: 5px 6px; color: var(--text3); border-bottom: 1px solid var(--bdr); font-weight: 500; }
.sc-tbl th:first-child { text-align: left; }
.sc-tbl td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--bdr); color: var(--text); }
.sc-tbl td:first-child { text-align: left; color: var(--text2); }
.sc-tbl tr.erow td { background: var(--bg3); }
.liqd { color: var(--red); font-weight: 500; }
.pos { color: var(--green); }
.neg { color: var(--red); }

/* ── LOADING ─────────────────────────────────────────────────── */
.loading { text-align: center; padding: 40px 20px; color: var(--text3); }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--bdr); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.placeholder-msg { text-align: center; padding: 40px 16px; color: var(--text3); font-size: 13px; line-height: 1.8; }

/* ── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px; }

/* ── MOBILE ──────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .header { padding: 10px 12px; }
  .logo { font-size: 11px; }
  .last-upd { display: none !important; }

  .main {
    display: block;
    min-height: unset;
    padding-bottom: 64px;
  }
  .left-panel { border-right: none; border-bottom: 1px solid var(--bdr); padding: 12px; }
  .right-panel { padding: 12px; background: var(--bg); display: none; }
  .right-panel.mobile-visible { display: block; }

  .mobile-tabs {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg2);
    border-top: 1px solid var(--bdr);
    z-index: 100;
  }
  .mob-tab {
    flex: 1; padding: 12px 8px; text-align: center;
    font-size: 11px; color: var(--text2); cursor: pointer;
    border: none; background: none; font-family: var(--sans);
    transition: color 0.15s;
  }
  .mob-tab.active { color: var(--green); }
  .mob-tab-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin: 0 auto 3px; opacity: 0; }
  .mob-tab.active .mob-tab-dot { opacity: 1; }

  .btc-bar { grid-template-columns: repeat(2, 1fr); }
  .sig-prices { grid-template-columns: repeat(2, 1fr); }
  .metrics-grid { grid-template-columns: repeat(3, 1fr); }
  .risk-grid { grid-template-columns: 1fr; }

  .lev-num { font-size: 26px; }
  .result-lev { font-size: 26px; }

  /* Bigger tap targets on mobile */
  .pill { padding: 5px 10px; font-size: 11px; }
  .sig-btn { padding: 10px; font-size: 13px; }
  .scan-btn { padding: 7px 10px; }
}

@media (min-width: 701px) {
  .last-upd { display: block; }
}
</style>

<script>

function showMobileTab(tab) {
  const isMobile = window.innerWidth <= 700;
  if(!isMobile) return;
  document.getElementById('tabSignals').classList.toggle('active', tab==='signals');
  document.getElementById('tabSizer').classList.toggle('active', tab==='sizer');
  document.getElementById('leftPanel').style.display  = tab==='signals' ? 'block' : 'none';
  document.getElementById('rightPanel').style.display = tab==='sizer'   ? 'block' : 'none';
}

// Restore normal layout on resize
window.addEventListener('resize', () => {
  if(window.innerWidth > 700) {
    document.getElementById('leftPanel').style.display  = '';
    document.getElementById('rightPanel').style.display = '';
  }
});


// ── PASTE YOUR CRYPTOCOMPARE API KEY HERE ────────────────────────────────────
const CC_KEY = '0dbe798e092bba3857b2bf111644614679e352ba22f58c52b7cbe04fc791dfeb';
// ─────────────────────────────────────────────────────────────────────────────

const COINS = ['ETH','SOL','BNB','AVAX','MATIC','ARB'];
const BTC   = 'BTC';
const MAINT = 0.004;

let selectedSignal = null;
let selRisk  = 25;
let selLev   = null;
let btcData  = null;
let altData  = {};
let signals  = [];

async function fetchCandles(symbol, limit=60) {
  const url = `https://min-api.cryptocompare.com/data/v2/histohour?fsym=${symbol}&tsym=USDT&limit=${limit}&api_key=${CC_KEY}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} for ${symbol}`);
  const d = await r.json();
  if(d.Response !== 'Success') throw new Error(`CC error ${symbol}: ${d.Message}`);
  const rows = d.Data.Data.filter(c => c.close > 0);
  // Slice off the last candle — it is the current incomplete hour.
  // An incomplete candle has near-zero high-low range, which collapses ADX to 0
  // and distorts correlation, beta, and volume z-score calculations.
  const complete = rows.length > 1 ? rows.slice(0, -1) : rows;
  if(complete.length < 10) throw new Error(`Only ${complete.length} complete candles for ${symbol}`);
  return complete.map(c => ({ t:c.time, o:c.open, h:c.high, l:c.low, c:c.close, v:c.volumefrom }));
}

function logRet(candles) {
  const ret = [];
  for(let i=1;i<candles.length;i++) {
    const p = candles[i-1].c, c = candles[i].c;
    ret.push((p>0 && c>0) ? Math.log(c/p) : 0);
  }
  return ret;
}

function rollingBeta(btcR, altR, w) {
  w = Math.min(w, btcR.length, altR.length);
  if(w < 2) return 0;
  const b = btcR.slice(-w), a = altR.slice(-w);
  const bm = b.reduce((s,x)=>s+x,0)/w, am = a.reduce((s,x)=>s+x,0)/w;
  let cov=0, vb=0;
  for(let i=0;i<w;i++){cov+=(b[i]-bm)*(a[i]-am);vb+=(b[i]-bm)**2;}
  return vb===0 ? 0 : cov/vb;
}

function rollingCorr(btcR, altR, w) {
  w = Math.min(w, btcR.length, altR.length);
  if(w < 2) return 0;
  const b = btcR.slice(-w), a = altR.slice(-w);
  const bm = b.reduce((s,x)=>s+x,0)/w, am = a.reduce((s,x)=>s+x,0)/w;
  let num=0, db=0, da=0;
  for(let i=0;i<w;i++){num+=(b[i]-bm)*(a[i]-am);db+=(b[i]-bm)**2;da+=(a[i]-am)**2;}
  return (db===0||da===0) ? 0 : num/Math.sqrt(db*da);
}

function computeAdx(candles, p=14) {
  // Proper Wilder-smoothed ADX — matches TradingView output
  if(candles.length < p*2+1) return 20;
  const trs=[], dps=[], dms=[];
  for(let i=1;i<candles.length;i++) {
    const c=candles[i], v=candles[i-1];
    trs.push(Math.max(c.h-c.l, Math.abs(c.h-v.c), Math.abs(c.l-v.c)));
    const up=c.h-v.h, dn=v.l-c.l;
    dps.push((up>dn && up>0) ? up : 0);
    dms.push((dn>up && dn>0) ? dn : 0);
  }
  // First smoothed values = sum of first p
  let atr = trs.slice(0,p).reduce((s,x)=>s+x,0);
  let adp = dps.slice(0,p).reduce((s,x)=>s+x,0);
  let adm = dms.slice(0,p).reduce((s,x)=>s+x,0);
  const dxArr=[];
  for(let i=p;i<trs.length;i++) {
    atr = atr - atr/p + trs[i];
    adp = adp - adp/p + dps[i];
    adm = adm - adm/p + dms[i];
    if(atr===0){dxArr.push(0);continue;}
    const dip=100*adp/atr, dim=100*adm/atr, den=dip+dim;
    dxArr.push(den===0 ? 0 : 100*Math.abs(dip-dim)/den);
  }
  if(dxArr.length < p) return 20;
  // ADX = Wilder-smoothed average of DX values
  let adx = dxArr.slice(0,p).reduce((s,x)=>s+x,0)/p;
  for(let i=p;i<dxArr.length;i++) adx = (adx*(p-1)+dxArr[i])/p;
  return adx;
}

function swingLow(candles, n=3) {
  if(candles.length < 2*n+1) return null;
  for(let i=candles.length-n-1; i>=n; i--) {
    const lo = candles[i].l;
    let ok = true;
    for(let j=i-n;j<i;j++) if(candles[j].l<=lo){ok=false;break;}
    if(!ok) continue;
    for(let j=i+1;j<=Math.min(i+n,candles.length-1);j++) if(candles[j].l<=lo){ok=false;break;}
    if(ok) return {price:lo, idx:i};
  }
  return null;
}

function volZscore(candles, w=24) {
  w = Math.min(w, candles.length-1);
  if(w < 2) return 0;
  const vols = candles.slice(-(w+1), -1).map(c=>c.v);
  const mean = vols.reduce((s,x)=>s+x,0)/vols.length;
  const std  = Math.sqrt(vols.map(v=>(v-mean)**2).reduce((s,x)=>s+x,0)/vols.length);
  return std===0 ? 0 : (candles[candles.length-1].v - mean)/std;
}

async function runScan() {
  document.getElementById('statusText').textContent = 'Scanning...';
  document.getElementById('signalList').innerHTML = '<div class="loading"><div class="spinner"></div><div>Fetching live data...</div></div>';

  if(!CC_KEY) {
    document.getElementById('statusText').textContent = 'No API key';
    document.getElementById('signalList').innerHTML = '<div class="no-signals">No API key set.<br><br>Open index.html in a text editor and paste your CryptoCompare API key into the CC_KEY variable at the top of the script.</div>';
    return;
  }

  try {
    // Fetch complete candles for all signal calculations (incomplete last candle already stripped)
    const btcCandles = await fetchCandles(BTC, 60);
    btcData = btcCandles;
    const btcRet   = logRet(btcCandles);
    const btcAdxV  = computeAdx(btcCandles);
    const btcSwing = swingLow(btcCandles);
    const btcVz    = volZscore(btcCandles);
    const regime   = btcAdxV < 25 ? 'RANGING' : 'TRENDING';

    // Fetch live price separately — gives real-time price + current-hour volume
    // CryptoCompare pricemultifull returns live tick data updated every ~10 seconds
    let livePrice = btcCandles[btcCandles.length-1].c;
    let liveVol   = btcCandles[btcCandles.length-1].v;
    try {
      const liveR = await fetch(`https://min-api.cryptocompare.com/data/pricemultifull?fsyms=BTC&tsyms=USDT&api_key=${CC_KEY}`);
      const liveD = await liveR.json();
      const raw   = liveD?.RAW?.BTC?.USDT;
      if(raw) {
        livePrice = raw.PRICE;
        liveVol   = raw.VOLUME24HOUR; // rolling 24h volume — more useful than 1h
      }
    } catch(e) { /* fallback to last closed candle values */ }

    // 1h change: live price vs last complete candle open (the candle currently forming)
    const lastComplete = btcCandles[btcCandles.length-1];
    const chg = ((livePrice - lastComplete.o) / lastComplete.o * 100).toFixed(2);

    document.getElementById('btcPrice').textContent  = '$'+livePrice.toLocaleString(undefined,{maximumFractionDigits:0});
    document.getElementById('btcChange').innerHTML   = `<span style="color:${chg>=0?'var(--green)':'var(--red)'}">${chg>=0?'+':''}${chg}%</span>`;
    document.getElementById('btcVol').textContent    = (liveVol/1000).toFixed(1)+'K BTC';
    document.getElementById('btcRegime').innerHTML   = `<span class="regime-badge ${regime==='RANGING'?'regime-ranging':'regime-trending'}">${regime} ${btcAdxV.toFixed(0)}</span>`;

    signals = [];
    for(const coin of COINS) {
      try {
        const ac  = await fetchCandles(coin, 60);
        altData[coin] = ac;
        const ar  = logRet(ac);
        const n   = Math.min(btcRet.length, ar.length);
        const b4  = rollingBeta(btcRet.slice(-n), ar.slice(-n), 4);
        const b24 = rollingBeta(btcRet.slice(-n), ar.slice(-n), Math.min(24,n));
        const cr  = rollingCorr(btcRet.slice(-n), ar.slice(-n), Math.min(24,n));
        const vz  = volZscore(ac);
        const asw = swingLow(ac);
        const al  = ac[ac.length-1];

        const c1 = b4 < 0.3 && b24 > 0.8;
        const c2 = btcSwing !== null;
        const c3 = asw !== null && al.l > asw.price;
        const c4 = vz > 1.0;

        console.log(`${coin}: beta4h=${b4.toFixed(3)} beta24h=${b24.toFixed(3)} vz=${vz.toFixed(2)} c1=${c1} c2=${c2} c3=${c3} c4=${c4}`);

        if(!c1 || !c2 || !c3 || !c4) continue;

        const bScore = Math.min((0.3-b4)/0.3, 1.0)*30;
        const oScore = Math.min((vz-1.0)/2.0, 1.0)*30;
        const rScore = regime==='RANGING' ? 25 : 0;
        const conf   = bScore + oScore + rScore + 15;
        const tier   = conf>=75?'A':conf>=55?'B':'C';
        if(tier==='C') continue;

        const entry    = al.c;
        const stop     = asw.price * 0.995;
        const stopDist = (entry-stop)/entry;
        if(stopDist<=0 || stop>=entry) continue;

        const btcMag   = btcSwing ? Math.abs(last.c-btcSwing.price)/btcSwing.price : 0;
        const target   = entry + Math.max(stopDist*entry*1.5, entry*btcMag*1.5);
        const rr       = (target-entry)/(entry-stop);
        if(rr < 1.5) continue;

        const idealLev = 0.25/stopDist;
        const maxSafe  = Math.floor(1/(stopDist+MAINT));
        const lev      = Math.min(Math.floor(idealLev), maxSafe, 100);
        if(lev < 1) continue;

        signals.push({coin, entry, stop, target, stopDistPct:stopDist*100, beta4h:b4, corr24h:cr, vz, regime, confidence:conf, tier, lev, rr, altSwing:asw.price, btcAdx:btcAdxV});
      } catch(e) {
        console.warn(`${coin} scan error:`, e.message);
      }
    }

    signals.sort((a,b)=>b.confidence-a.confidence);
    renderSignals(signals, regime, btcAdxV);
    document.getElementById('statusText').textContent = `Live — ${signals.length} signal${signals.length!==1?'s':''} found`;
    document.getElementById('lastUpdate').textContent = 'Updated '+new Date().toLocaleTimeString();

  } catch(e) {
    console.error('runScan error:', e);
    document.getElementById('statusText').textContent = 'Error — see console (F12)';
    document.getElementById('signalList').innerHTML = `<div class="no-signals">Fetch error: ${e.message}</div>`;
  }
}

    return;
  }
  list.innerHTML = sigs.map((s,i) => `
    <div class="signal-card tier-${s.tier.toLowerCase()}" id="card-${i}">
      <div class="sig-top">
        <div>

        <div class="price-item"><div class="price-lbl">R:R</div><div class="price-val" style="color:var(--text)">1:${s.rr.toFixed(2)}</div></div>
      </div>
      <div class="sig-tags">
        <span class="tag ${s.regime==='RANGING'?'tag-ok':'tag-warn'}">${s.regime}</span>

}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='scenario') buildScenario();
}

function syncRisk(v) {
  selRisk = parseInt(v);
  document.getElementById('riskDisplay').textContent = v+'%';
  document.querySelectorAll('.risk-pills .pill').forEach(p=>p.classList.toggle('active', p.textContent===v+'%'));
  compute();
}
function setRisk(v) {
  selRisk = v;
  document.getElementById('riskSlider').value = v;
  document.getElementById('riskDisplay').textContent = v+'%';
  document.querySelectorAll('.risk-pills .pill').forEach(p=>p.classList.toggle('active', p.textContent===v+'%'));
  compute();
}

function compute() {
  const s = selectedSignal;
  if(!s) return;
  const cap = parseFloat(document.getElementById('capitalInput')?.value)||100;
  const riskPct = selRisk/100;
  const stopDist = s.stopDistPct/100;
  const tpDist = (s.target-s.entry)/s.entry;
  const idealLev = riskPct/stopDist;
  const maxSafe = Math.floor(1/(stopDist+MAINT));
  const derived = Math.min(Math.floor(idealLev), maxSafe, 100);
  if(!selLev || selLev===0) selLev = derived;
  const lev = Math.max(1, Math.min(100, selLev));
  const notional = cap*lev;
  const lossAmt = notional*stopDist;
  const lossActPct = (lossAmt/cap*100).toFixed(1);
  const liqP = s.entry*(1-(1/lev)+MAINT);
  const liqDist = ((s.entry-liqP)/s.entry*100).toFixed(2);
  const tpPnl = notional*tpDist;
  const rrActual = (tpPnl/lossAmt).toFixed(2);
  const safe = lev<=maxSafe;

  document.getElementById('levDisplay').textContent = lev+'x';
  document.getElementById('levNote').textContent = 'ideal '+idealLev.toFixed(2)+'x → rounded down';
  const badge = document.getElementById('levBadge');
  badge.textContent = safe?'safe':'unsafe';
  badge.className = safe?'lev-safe':'lev-unsafe';
  document.getElementById('warnBox').style.display = safe?'none':'block';
  document.getElementById('maxSafeLbl').textContent = maxSafe+'x';
  document.getElementById('barFill').style.width = Math.min(lev/100*100,100)+'%';
  document.getElementById('barMarker').style.left = Math.min(maxSafe/100*100,100)+'%';
  document.getElementById('mLoss').textContent = '-$'+lossAmt.toFixed(2);
  document.getElementById('mLossPct').textContent = lossActPct+'% of capital';
  document.getElementById('mNotional').textContent = '$'+notional.toLocaleString(undefined,{maximumFractionDigits:0});
  document.getElementById('mMargin').textContent = '$'+cap.toLocaleString(undefined,{maximumFractionDigits:0})+' margin';
  document.getElementById('mLiq').textContent = '$'+liqP.toFixed(4);
  document.getElementById('mLiqDist').textContent = '−'+liqDist+'% from entry';
  document.getElementById('oTpPct').textContent = (tpDist*100).toFixed(2);
  document.getElementById('oSlPct').textContent = s.stopDistPct.toFixed(2);
  document.getElementById('oTpPnl').textContent = '+$'+tpPnl.toFixed(2);
  document.getElementById('oSlPnl').textContent = '-$'+lossAmt.toFixed(2);
  document.getElementById('oRR').textContent = '1 : '+rrActual;

  const container = document.getElementById('levPills');
  if(container) {
    const opts = [1,2,3,5,10,15,20,25,30,50,75,100];
    container.innerHTML = opts.map(l=>`<button class="pill${l===lev?' active':''}${l>maxSafe?' disabled':''}" onclick="selLev=${l};compute()">${l}x</button>`).join('');
  }
  const sc = document.getElementById('scCap');
  if(sc) sc.textContent = cap.toLocaleString(undefined,{maximumFractionDigits:0});
}

function buildScenario() {
  const s = selectedSignal;
  if(!s) return;
  const cap = parseFloat(document.getElementById('capitalInput')?.value)||100;
  const leverages = [1,2,3,5,10,20,50,100];
  const prices = [
    {label:'Target hit', price:s.target, cls:''},
    {label:'+2%', price:s.entry*1.02, cls:''},
    {label:'Entry', price:s.entry, cls:'entry-row'},
    {label:'-1%', price:s.entry*0.99, cls:''},
    {label:'Stop hit', price:s.stop, cls:''},
    {label:'-5%', price:s.entry*0.95, cls:''},
    {label:'-10%', price:s.entry*0.90, cls:''},
  ];
  let html = '<thead><tr><th>Price</th>';
  leverages.forEach(l=>html+=`<th>${l}x</th>`);
  html += '</tr></thead><tbody>';
  prices.forEach(row=>{
    const movePct=(row.price-s.entry)/s.entry;
    html+=`<tr class="${row.cls}"><td>${row.label}</td>`;
    leverages.forEach(l=>{
      const liqP=s.entry*(1-(1/l)+MAINT);
      if(row.price<=liqP && row.cls!=='entry-row'){
        html+=`<td class="liqd">LIQD</td>`;
      } else {
        const pnl=cap*l*movePct;
        const cls=pnl>0?'pos':pnl<0?'neg':'';
        html+=`<td class="${cls}">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(1)}</td>`;
      }
    });
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById('scTable').innerHTML = html;
  document.getElementById('scTable').parentElement.className = 'sc-wrap';
}
