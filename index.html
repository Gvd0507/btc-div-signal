<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC-Alt Divergence Signals</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0e1010;
    --bg2: #151919;
    --bg3: #1a2020;
    --bg4: #1f2727;
    --border: #2a3535;
    --border2: #334444;
    --text: #d4e0e0;
    --text2: #7a9898;
    --text3: #4a6868;
    --green: #00c896;
    --green-dim: #00c89622;
    --red: #ff4d4d;
    --red-dim: #ff4d4d18;
    --blue: #4fa3d4;
    --blue-dim: #4fa3d420;
    --amber: #f0a044;
    --amber-dim: #f0a04420;
    --white: #eef4f4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: var(--green); letter-spacing: 0.05em; }
  .header-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .refresh-btn {
    background: none; border: 1px solid var(--border2); color: var(--text2);
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    font-family: 'IBM Plex Sans', sans-serif; transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--green); color: var(--green); }
  .last-update { font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }

  /* MAIN LAYOUT */
  .main { display: grid; grid-template-columns: 1fr 380px; gap: 0; height: calc(100vh - 49px); }
  .left-panel { padding: 20px; overflow-y: auto; border-right: 1px solid var(--border); }
  .right-panel { padding: 20px; overflow-y: auto; background: var(--bg2); }

  /* SECTION HEADERS */
  .section-label {
    font-size: 10px; font-weight: 500; color: var(--text3);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* BTC STATUS BAR */
  .btc-bar {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 16px;
    display: flex; align-items: center; gap: 24px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .btc-item { display: flex; flex-direction: column; gap: 2px; }
  .btc-item-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .btc-item-val { font-size: 14px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; }
  .regime-badge {
    padding: 3px 10px; border-radius: 3px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .regime-ranging { background: var(--green-dim); color: var(--green); border: 1px solid #00c89640; }
  .regime-trending { background: var(--amber-dim); color: var(--amber); border: 1px solid #f0a04440; }

  /* SIGNAL CARDS */
  .signal-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 0 6px 6px 0;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .signal-card:hover { border-color: var(--blue); border-left-color: var(--blue); background: var(--bg4); }
  .signal-card.tier-a { border-left-color: var(--green); }
  .signal-card.tier-b { border-left-color: var(--blue); }
  .signal-card.tier-c { border-left-color: var(--text3); }

  .signal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .signal-meta { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
  .signal-title { font-size: 16px; font-weight: 500; color: var(--white); }

  .tier-badge {
    padding: 3px 10px; border-radius: 3px; font-size: 12px; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .tier-a-badge { background: var(--green-dim); color: var(--green); border: 1px solid #00c89650; }
  .tier-b-badge { background: var(--blue-dim); color: var(--blue); border: 1px solid #4fa3d450; }
  .tier-c-badge { background: #ffffff08; color: var(--text2); border: 1px solid var(--border); }

  .signal-prices { display: flex; gap: 20px; margin-bottom: 10px; }
  .price-item { display: flex; flex-direction: column; gap: 2px; }
  .price-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .price-val { font-size: 13px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .entry-val { color: var(--blue); }
  .stop-val { color: var(--red); }
  .target-val { color: var(--green); }

  .signal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 3px;
    border: 1px solid var(--border); color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
  }
  .tag-ok { border-color: #00c89640; color: var(--green); background: var(--green-dim); }
  .tag-warn { border-color: #f0a04440; color: var(--amber); background: var(--amber-dim); }

  .signal-select-btn {
    width: 100%; margin-top: 10px; background: none;
    border: 1px solid var(--border2); color: var(--text2);
    padding: 7px; border-radius: 4px; cursor: pointer; font-size: 12px;
    font-family: 'IBM Plex Sans', sans-serif; transition: all 0.15s; text-align: center;
  }
  .signal-select-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }
  .signal-select-btn.selected { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  .no-signals {
    text-align: center; padding: 48px 20px; color: var(--text3);
    border: 1px dashed var(--border); border-radius: 6px; font-size: 13px;
  }

  /* RIGHT PANEL - SIZER */
  .active-signal-header {
    background: var(--bg3); border: 1px solid var(--border);
    border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .active-signal-header.tier-a { border-left-color: var(--green); }

  .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    font-size: 13px; padding: 8px 14px; cursor: pointer;
    color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  .tab:hover:not(.active) { color: var(--text); }
  .panel { display: none; }
  .panel.active { display: block; }

  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .input-wrap {
    display: flex; align-items: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .input-wrap:focus-within { border-color: var(--border2); }
  .input-prefix { padding: 0 10px; color: var(--text3); font-size: 13px; border-right: 1px solid var(--border); height: 36px; display: flex; align-items: center; }
  .input-wrap input {
    background: none; border: none; outline: none; color: var(--white);
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    padding: 0 10px; height: 36px; width: 100%;
  }

  .risk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .risk-input-group { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .risk-slider-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  input[type=range] {
    -webkit-appearance: none; flex: 1; height: 3px;
    background: var(--border2); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--green); border-radius: 50%; cursor: pointer;
  }
  .risk-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: var(--white); min-width: 38px; text-align: right; }

  .risk-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 3px;
    border: 1px solid var(--border); color: var(--text2); cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; transition: all 0.12s; background: none;
  }
  .pill:hover { border-color: var(--border2); color: var(--text); }
  .pill.active { background: var(--green-dim); border-color: #00c89650; color: var(--green); }
  .pill.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  .result-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px; margin-bottom: 12px;
  }
  .result-lev { font-size: 32px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; color: var(--white); }
  .result-lev-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .lev-safe { background: var(--green-dim); color: var(--green); border: 1px solid #00c89640; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
  .lev-unsafe { background: var(--red-dim); color: var(--red); border: 1px solid #ff4d4d40; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
  .result-note { font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }

  .bar-wrap { margin: 10px 0 4px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
  .bar-track { height: 4px; background: var(--border); border-radius: 2px; position: relative; }
  .bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.2s; }
  .bar-marker { position: absolute; top: -4px; width: 2px; height: 12px; background: var(--red); border-radius: 1px; }
  .bar-hint { font-size: 10px; color: var(--text3); margin-top: 4px; }

  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .metric-box { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .metric-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .metric-val { font-size: 16px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; }

  .outcome-card { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; }
  .outcome-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .outcome-row:not(:last-child) { border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .outcome-label { color: var(--text2); }
  .outcome-val-g { color: var(--green); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .outcome-val-r { color: var(--red); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .outcome-val { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

  .warn-box {
    background: var(--red-dim); border: 1px solid #ff4d4d30; border-radius: 4px;
    padding: 8px 12px; font-size: 11px; color: var(--red); margin-top: 8px;
    display: none; line-height: 1.5;
  }

  /* SCENARIO TABLE */
  .scenario-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .scenario-table th {
    text-align: right; padding: 5px 8px; color: var(--text3);
    border-bottom: 1px solid var(--border); font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .scenario-table th:first-child { text-align: left; }
  .scenario-table td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; color: var(--text); }
  .scenario-table td:first-child { text-align: left; color: var(--text2); }
  .scenario-table tr.entry-row td { background: var(--bg3); color: var(--text); }
  .liqd { color: var(--red); font-weight: 500; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--text3); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .placeholder-msg {
    text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; line-height: 1.8;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">BTC-ALT DIVERGENCE</div>
    <div class="header-status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="last-update" id="lastUpdate">—</div>
    <button class="refresh-btn" onclick="runScan()">Scan now</button>
  </div>
</div>

<div class="main">

  <!-- LEFT: SIGNAL LIST -->
  <div class="left-panel">
    <div class="btc-bar" id="btcBar">
      <div class="btc-item"><div class="btc-item-label">BTC Price</div><div class="btc-item-val" id="btcPrice">—</div></div>
      <div class="btc-item"><div class="btc-item-label">1h Change</div><div class="btc-item-val" id="btcChange">—</div></div>
      <div class="btc-item"><div class="btc-item-label">Regime (ADX)</div><div id="btcRegime">—</div></div>
      <div class="btc-item"><div class="btc-item-label">BTC Volume 1h</div><div class="btc-item-val" id="btcVol">—</div></div>
    </div>

    <div class="section-label">Live Divergence Signals</div>
    <div id="signalList"><div class="loading"><div class="spinner"></div><div>Fetching live data from Binance...</div></div></div>
  </div>

  <!-- RIGHT: SIZER -->
  <div class="right-panel">
    <div class="section-label">Position Sizer</div>
    <div id="sizerContent">
      <div class="placeholder-msg">
        Select a signal on the left<br>to calculate position size and leverage.
      </div>
    </div>
  </div>

</div>

<script>
// ── PASTE YOUR CRYPTOCOMPARE API KEY HERE ────────────────────────────────────
const CC_KEY = '0dbe798e092bba3857b2bf111644614679e352ba22f58c52b7cbe04fc791dfeb';
// ─────────────────────────────────────────────────────────────────────────────

const COINS = ['ETH','SOL','BNB','AVAX','MATIC','ARB'];
const BTC   = 'BTC';
const MAINT = 0.004;

let selectedSignal = null;
let selRisk  = 25;
let selLev   = null;
let btcData  = null;
let altData  = {};
let signals  = [];

async function fetchCandles(symbol, limit=60) {
  const url = `https://min-api.cryptocompare.com/data/v2/histohour?fsym=${symbol}&tsym=USDT&limit=${limit}&api_key=${CC_KEY}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} for ${symbol}`);
  const d = await r.json();
  if(d.Response !== 'Success') throw new Error(`CC error ${symbol}: ${d.Message}`);
  const rows = d.Data.Data.filter(c => c.close > 0);
  if(rows.length < 10) throw new Error(`Only ${rows.length} candles for ${symbol}`);
  return rows.map(c => ({ t:c.time, o:c.open, h:c.high, l:c.low, c:c.close, v:c.volumefrom }));
}

function logRet(candles) {
  const ret = [];
  for(let i=1;i<candles.length;i++) {
    const p = candles[i-1].c, c = candles[i].c;
    ret.push((p>0 && c>0) ? Math.log(c/p) : 0);
  }
  return ret;
}

function rollingBeta(btcR, altR, w) {
  w = Math.min(w, btcR.length, altR.length);
  if(w < 2) return 0;
  const b = btcR.slice(-w), a = altR.slice(-w);
  const bm = b.reduce((s,x)=>s+x,0)/w, am = a.reduce((s,x)=>s+x,0)/w;
  let cov=0, vb=0;
  for(let i=0;i<w;i++){cov+=(b[i]-bm)*(a[i]-am);vb+=(b[i]-bm)**2;}
  return vb===0 ? 0 : cov/vb;
}

function rollingCorr(btcR, altR, w) {
  w = Math.min(w, btcR.length, altR.length);
  if(w < 2) return 0;
  const b = btcR.slice(-w), a = altR.slice(-w);
  const bm = b.reduce((s,x)=>s+x,0)/w, am = a.reduce((s,x)=>s+x,0)/w;
  let num=0, db=0, da=0;
  for(let i=0;i<w;i++){num+=(b[i]-bm)*(a[i]-am);db+=(b[i]-bm)**2;da+=(a[i]-am)**2;}
  return (db===0||da===0) ? 0 : num/Math.sqrt(db*da);
}

function computeAdx(candles, p=14) {
  if(candles.length < p+2) return 20;
  let trS=0, dpS=0, dmS=0;
  for(let i=candles.length-p; i<candles.length; i++) {
    const c=candles[i], v=candles[i-1];
    trS += Math.max(c.h-c.l, Math.abs(c.h-v.c), Math.abs(c.l-v.c));
    const up=c.h-v.h, dn=v.l-c.l;
    if(up>dn && up>0) dpS+=up;
    if(dn>up && dn>0) dmS+=dn;
  }
  if(trS===0) return 20;
  const dip=100*dpS/trS, dim=100*dmS/trS, den=dip+dim;
  return den===0 ? 20 : 100*Math.abs(dip-dim)/den;
}

function swingLow(candles, n=3) {
  if(candles.length < 2*n+1) return null;
  for(let i=candles.length-n-1; i>=n; i--) {
    const lo = candles[i].l;
    let ok = true;
    for(let j=i-n;j<i;j++) if(candles[j].l<=lo){ok=false;break;}
    if(!ok) continue;
    for(let j=i+1;j<=Math.min(i+n,candles.length-1);j++) if(candles[j].l<=lo){ok=false;break;}
    if(ok) return {price:lo, idx:i};
  }
  return null;
}

function volZscore(candles, w=24) {
  w = Math.min(w, candles.length-1);
  if(w < 2) return 0;
  const vols = candles.slice(-(w+1), -1).map(c=>c.v);
  const mean = vols.reduce((s,x)=>s+x,0)/vols.length;
  const std  = Math.sqrt(vols.map(v=>(v-mean)**2).reduce((s,x)=>s+x,0)/vols.length);
  return std===0 ? 0 : (candles[candles.length-1].v - mean)/std;
}

async function runScan() {
  document.getElementById('statusText').textContent = 'Scanning...';
  document.getElementById('signalList').innerHTML = '<div class="loading"><div class="spinner"></div><div>Fetching live data...</div></div>';

  if(!CC_KEY) {
    document.getElementById('statusText').textContent = 'No API key';
    document.getElementById('signalList').innerHTML = '<div class="no-signals">No API key set.<br><br>Open index.html in a text editor and paste your CryptoCompare API key into the CC_KEY variable at the top of the script.</div>';
    return;
  }

  try {
    const btcCandles = await fetchCandles(BTC, 60);
    btcData = btcCandles;
    const btcRet   = logRet(btcCandles);
    const btcAdxV  = computeAdx(btcCandles);
    const btcSwing = swingLow(btcCandles);
    const btcVz    = volZscore(btcCandles);
    const last     = btcCandles[btcCandles.length-1];
    const prev     = btcCandles[btcCandles.length-2];
    const chg      = ((last.c-prev.c)/prev.c*100).toFixed(2);
    const regime   = btcAdxV < 25 ? 'RANGING' : 'TRENDING';

    document.getElementById('btcPrice').textContent  = '$'+last.c.toLocaleString(undefined,{maximumFractionDigits:0});
    document.getElementById('btcChange').innerHTML   = `<span style="color:${chg>=0?'var(--green)':'var(--red)'}">${chg>=0?'+':''}${chg}%</span>`;
    document.getElementById('btcVol').textContent    = last.v.toFixed(0)+' BTC';
    document.getElementById('btcRegime').innerHTML   = `<span class="regime-badge ${regime==='RANGING'?'regime-ranging':'regime-trending'}">${regime} ${btcAdxV.toFixed(0)}</span>`;

    signals = [];
    for(const coin of COINS) {
      try {
        const ac  = await fetchCandles(coin, 60);
        altData[coin] = ac;
        const ar  = logRet(ac);
        const n   = Math.min(btcRet.length, ar.length);
        const b4  = rollingBeta(btcRet.slice(-n), ar.slice(-n), 4);
        const b24 = rollingBeta(btcRet.slice(-n), ar.slice(-n), Math.min(24,n));
        const cr  = rollingCorr(btcRet.slice(-n), ar.slice(-n), Math.min(24,n));
        const vz  = volZscore(ac);
        const asw = swingLow(ac);
        const al  = ac[ac.length-1];

        const c1 = b4 < 0.3 && b24 > 0.8;
        const c2 = btcSwing !== null;
        const c3 = asw !== null && al.l > asw.price;
        const c4 = vz > 1.0;

        console.log(`${coin}: beta4h=${b4.toFixed(3)} beta24h=${b24.toFixed(3)} vz=${vz.toFixed(2)} c1=${c1} c2=${c2} c3=${c3} c4=${c4}`);

        if(!c1 || !c2 || !c3 || !c4) continue;

        const bScore = Math.min((0.3-b4)/0.3, 1.0)*30;
        const oScore = Math.min((vz-1.0)/2.0, 1.0)*30;
        const rScore = regime==='RANGING' ? 25 : 0;
        const conf   = bScore + oScore + rScore + 15;
        const tier   = conf>=75?'A':conf>=55?'B':'C';
        if(tier==='C') continue;

        const entry    = al.c;
        const stop     = asw.price * 0.995;
        const stopDist = (entry-stop)/entry;
        if(stopDist<=0 || stop>=entry) continue;

        const btcMag   = btcSwing ? Math.abs(last.c-btcSwing.price)/btcSwing.price : 0;
        const target   = entry + Math.max(stopDist*entry*1.5, entry*btcMag*1.5);
        const rr       = (target-entry)/(entry-stop);
        if(rr < 1.5) continue;

        const idealLev = 0.25/stopDist;
        const maxSafe  = Math.floor(1/(stopDist+MAINT));
        const lev      = Math.min(Math.floor(idealLev), maxSafe, 100);
        if(lev < 1) continue;

        signals.push({coin, entry, stop, target, stopDistPct:stopDist*100, beta4h:b4, corr24h:cr, vz, regime, confidence:conf, tier, lev, rr, altSwing:asw.price, btcAdx:btcAdxV});
      } catch(e) {
        console.warn(`${coin} scan error:`, e.message);
      }
    }

    signals.sort((a,b)=>b.confidence-a.confidence);
    renderSignals(signals, regime, btcAdxV);
    document.getElementById('statusText').textContent = `Live — ${signals.length} signal${signals.length!==1?'s':''} found`;
    document.getElementById('lastUpdate').textContent = 'Updated '+new Date().toLocaleTimeString();

  } catch(e) {
    console.error('runScan error:', e);
    document.getElementById('statusText').textContent = 'Error — see console (F12)';
    document.getElementById('signalList').innerHTML = `<div class="no-signals">Fetch error: ${e.message}</div>`;
  }
}


function renderSignals(sigs, regime, btcAdx) {
  const list = document.getElementById('signalList');
  if(sigs.length === 0) {
    list.innerHTML = `<div class="no-signals">No divergence signals detected right now.<br><br>ADX ${btcAdx.toFixed(0)} — regime: ${regime}<br><br>${regime==='TRENDING'?'BTC is trending — most signals filtered out. Check back when ADX drops below 25.':'Conditions scanned. No qualifying divergence across the alt basket.'}</div>`;
    return;
  }
  list.innerHTML = sigs.map((s,i) => `
    <div class="signal-card tier-${s.tier.toLowerCase()}" id="card-${i}">
      <div class="signal-top">
        <div>
          <div class="signal-meta">Active signal</div>
          <div class="signal-title">${s.coin}/USDT long</div>
        </div>
        <div class="tier-badge tier-${s.tier.toLowerCase()}-badge">${s.tier} — ${s.confidence.toFixed(0)}/100</div>
      </div>
      <div class="signal-prices">
        <div class="price-item"><div class="price-label">Entry</div><div class="price-val entry-val">$${s.entry.toFixed(4)}</div></div>
        <div class="price-item"><div class="price-label">Stop</div><div class="price-val stop-val">$${s.stop.toFixed(4)}</div></div>
        <div class="price-item"><div class="price-label">Target</div><div class="price-val target-val">$${s.target.toFixed(4)}</div></div>
        <div class="price-item"><div class="price-label">R:R</div><div class="price-val" style="color:var(--text)">1:${s.rr.toFixed(2)}</div></div>
      </div>
      <div class="signal-tags">
        <span class="tag ${s.regime==='RANGING'?'tag-ok':'tag-warn'}">${s.regime}</span>
        <span class="tag tag-ok">OI z ${s.vz.toFixed(2)}</span>
        <span class="tag tag-ok">β ${s.beta4h.toFixed(2)}</span>
        <span class="tag">Stop ${s.stopDistPct.toFixed(2)}%</span>
        <span class="tag">Lev ${s.lev}x</span>
      </div>
      <button class="signal-select-btn" id="btn-${i}" onclick="selectSignal(${i})">Size this trade</button>
    </div>
  `).join('');
}

function selectSignal(i) {
  selectedSignal = signals[i];
  selLev = selectedSignal.lev;
  document.querySelectorAll('.signal-select-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('btn-'+i).classList.add('selected');
  renderSizer();
}

function renderSizer() {
  const s = selectedSignal;
  if(!s) return;
  const tierCls = s.tier==='A'?'tier-a':'';
  document.getElementById('sizerContent').innerHTML = `
    <div class="active-signal-header ${tierCls}">
      <div class="signal-meta">Active signal</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px;">
        <div style="font-size:15px;font-weight:500;color:var(--white)">${s.coin}/USDT long</div>
        <div class="tier-badge tier-${s.tier.toLowerCase()}-badge">${s.tier} — ${s.confidence.toFixed(0)}/100</div>
      </div>
      <div class="signal-prices" style="margin-top:8px;margin-bottom:0">
        <div class="price-item"><div class="price-label">Entry</div><div class="price-val entry-val">$${s.entry.toFixed(4)}</div></div>
        <div class="price-item"><div class="price-label">Stop</div><div class="price-val stop-val">$${s.stop.toFixed(4)}</div></div>
        <div class="price-item"><div class="price-label">Target</div><div class="price-val target-val">$${s.target.toFixed(4)}</div></div>
      </div>
    </div>

    <div class="tab-row">
      <div class="tab active" onclick="switchTab('sizer',this)">Risk-based sizer</div>
      <div class="tab" onclick="switchTab('scenario',this)">Scenario table</div>
    </div>

    <div id="panel-sizer" class="panel active">
      <div class="risk-grid">
        <div class="risk-input-group">
          <div class="input-label">Trade capital</div>
          <div class="input-wrap" style="margin-top:6px;">
            <div class="input-prefix">$</div>
            <input type="number" id="capitalInput" value="100" min="1" oninput="compute()">
          </div>
        </div>
        <div class="risk-input-group">
          <div class="input-label">Risk per trade</div>
          <div class="risk-slider-row">
            <input type="range" id="riskSlider" min="1" max="50" value="25" step="1" oninput="syncRisk(this.value)">
            <div class="risk-val" id="riskDisplay">25%</div>
          </div>
          <div class="risk-pills">
            <button class="pill" onclick="setRisk(1)">1%</button>
            <button class="pill" onclick="setRisk(2)">2%</button>
            <button class="pill" onclick="setRisk(5)">5%</button>
            <button class="pill" onclick="setRisk(10)">10%</button>
            <button class="pill active" onclick="setRisk(25)">25%</button>
          </div>
        </div>
      </div>

      <div class="result-card">
        <div class="input-label" style="margin-bottom:8px;">Suggested leverage</div>
        <div class="result-lev-row">
          <div class="result-lev" id="levDisplay">${s.lev}x</div>
          <div id="levBadge" class="lev-safe">safe</div>
          <div class="result-note" id="levNote"></div>
        </div>
        <div class="input-label" style="margin-bottom:6px;">Select leverage manually</div>
        <div class="risk-pills" id="levPills"></div>
        <div class="bar-wrap">
          <div class="bar-labels"><span>1x</span><span>Max safe: <b id="maxSafeLbl" style="color:var(--text)"></b></span><span>100x</span></div>
          <div class="bar-track"><div class="bar-fill" id="barFill"></div><div class="bar-marker" id="barMarker"></div></div>
          <div class="bar-hint">Blue = selected &nbsp;|&nbsp; Red line = liquidation overtakes stop</div>
        </div>
        <div class="warn-box" id="warnBox">Above this leverage, your liquidation price rises above your stop. The stop never fires — you take a liquidation loss instead.</div>
      </div>

      <div class="metrics-grid">
        <div class="metric-box"><div class="metric-label">Max loss</div><div class="metric-val" id="mLoss" style="color:var(--red)">—</div><div style="font-size:10px;color:var(--text3);margin-top:2px;" id="mLossPct">—</div></div>
        <div class="metric-box"><div class="metric-label">Notional</div><div class="metric-val" id="mNotional">—</div><div style="font-size:10px;color:var(--text3);margin-top:2px;" id="mMargin">—</div></div>
        <div class="metric-box"><div class="metric-label">Liquidation</div><div class="metric-val" id="mLiq" style="color:var(--amber)">—</div><div style="font-size:10px;color:var(--text3);margin-top:2px;" id="mLiqDist">—</div></div>
      </div>

      <div class="outcome-card">
        <div class="outcome-row"><div class="outcome-label">Target hit (+<span id="oTpPct"></span>%)</div><div class="outcome-val-g" id="oTpPnl">—</div></div>
        <div class="outcome-row"><div class="outcome-label">Stop hit (−<span id="oSlPct"></span>%)</div><div class="outcome-val-r" id="oSlPnl">—</div></div>
        <div class="outcome-row" style="border-bottom:none;padding-bottom:0;margin-bottom:0"><div class="outcome-label">Risk/reward ratio</div><div class="outcome-val" id="oRR">—</div></div>
      </div>
    </div>

    <div id="panel-scenario" class="panel">
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px;">P&amp;L on $<span id="scCap">100</span> capital. LIQD = liquidated before price reached.</div>
      <div style="overflow-x:auto;"><table class="scenario-table" id="scTable"></table></div>
    </div>
  `;
  compute();
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='scenario') buildScenario();
}

function syncRisk(v) {
  selRisk = parseInt(v);
  document.getElementById('riskDisplay').textContent = v+'%';
  document.querySelectorAll('.risk-pills .pill').forEach(p=>p.classList.toggle('active', p.textContent===v+'%'));
  compute();
}
function setRisk(v) {
  selRisk = v;
  document.getElementById('riskSlider').value = v;
  document.getElementById('riskDisplay').textContent = v+'%';
  document.querySelectorAll('.risk-pills .pill').forEach(p=>p.classList.toggle('active', p.textContent===v+'%'));
  compute();
}

function compute() {
  const s = selectedSignal;
  if(!s) return;
  const cap = parseFloat(document.getElementById('capitalInput')?.value)||100;
  const riskPct = selRisk/100;
  const stopDist = s.stopDistPct/100;
  const tpDist = (s.target-s.entry)/s.entry;
  const idealLev = riskPct/stopDist;
  const maxSafe = Math.floor(1/(stopDist+MAINT));
  const derived = Math.min(Math.floor(idealLev), maxSafe, 100);
  if(!selLev || selLev===0) selLev = derived;
  const lev = Math.max(1, Math.min(100, selLev));
  const notional = cap*lev;
  const lossAmt = notional*stopDist;
  const lossActPct = (lossAmt/cap*100).toFixed(1);
  const liqP = s.entry*(1-(1/lev)+MAINT);
  const liqDist = ((s.entry-liqP)/s.entry*100).toFixed(2);
  const tpPnl = notional*tpDist;
  const rrActual = (tpPnl/lossAmt).toFixed(2);
  const safe = lev<=maxSafe;

  document.getElementById('levDisplay').textContent = lev+'x';
  document.getElementById('levNote').textContent = 'ideal '+idealLev.toFixed(2)+'x → rounded down';
  const badge = document.getElementById('levBadge');
  badge.textContent = safe?'safe':'unsafe';
  badge.className = safe?'lev-safe':'lev-unsafe';
  document.getElementById('warnBox').style.display = safe?'none':'block';
  document.getElementById('maxSafeLbl').textContent = maxSafe+'x';
  document.getElementById('barFill').style.width = Math.min(lev/100*100,100)+'%';
  document.getElementById('barMarker').style.left = Math.min(maxSafe/100*100,100)+'%';
  document.getElementById('mLoss').textContent = '-$'+lossAmt.toFixed(2);
  document.getElementById('mLossPct').textContent = lossActPct+'% of capital';
  document.getElementById('mNotional').textContent = '$'+notional.toLocaleString(undefined,{maximumFractionDigits:0});
  document.getElementById('mMargin').textContent = '$'+cap.toLocaleString(undefined,{maximumFractionDigits:0})+' margin';
  document.getElementById('mLiq').textContent = '$'+liqP.toFixed(4);
  document.getElementById('mLiqDist').textContent = '−'+liqDist+'% from entry';
  document.getElementById('oTpPct').textContent = (tpDist*100).toFixed(2);
  document.getElementById('oSlPct').textContent = s.stopDistPct.toFixed(2);
  document.getElementById('oTpPnl').textContent = '+$'+tpPnl.toFixed(2);
  document.getElementById('oSlPnl').textContent = '-$'+lossAmt.toFixed(2);
  document.getElementById('oRR').textContent = '1 : '+rrActual;

  const container = document.getElementById('levPills');
  if(container) {
    const opts = [1,2,3,5,10,15,20,25,30,50,75,100];
    container.innerHTML = opts.map(l=>`<button class="pill${l===lev?' active':''}${l>maxSafe?' disabled':''}" onclick="selLev=${l};compute()">${l}x</button>`).join('');
  }
  const sc = document.getElementById('scCap');
  if(sc) sc.textContent = cap.toLocaleString(undefined,{maximumFractionDigits:0});
}

function buildScenario() {
  const s = selectedSignal;
  if(!s) return;
  const cap = parseFloat(document.getElementById('capitalInput')?.value)||100;
  const leverages = [1,2,3,5,10,20,50,100];
  const prices = [
    {label:'Target hit', price:s.target, cls:''},
    {label:'+2%', price:s.entry*1.02, cls:''},
    {label:'Entry', price:s.entry, cls:'entry-row'},
    {label:'-1%', price:s.entry*0.99, cls:''},
    {label:'Stop hit', price:s.stop, cls:''},
    {label:'-5%', price:s.entry*0.95, cls:''},
    {label:'-10%', price:s.entry*0.90, cls:''},
  ];
  let html = '<thead><tr><th>Price</th>';
  leverages.forEach(l=>html+=`<th>${l}x</th>`);
  html += '</tr></thead><tbody>';
  prices.forEach(row=>{
    const movePct=(row.price-s.entry)/s.entry;
    html+=`<tr class="${row.cls}"><td>${row.label}</td>`;
    leverages.forEach(l=>{
      const liqP=s.entry*(1-(1/l)+MAINT);
      if(row.price<=liqP && row.cls!=='entry-row'){
        html+=`<td class="liqd">LIQD</td>`;
      } else {
        const pnl=cap*l*movePct;
        const cls=pnl>0?'pos':pnl<0?'neg':'';
        html+=`<td class="${cls}">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(1)}</td>`;
      }
    });
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById('scTable').innerHTML = html;
}

// Key setup

// Auto refresh
runScan();
setInterval(runScan, 5*60*1000);
</script>
